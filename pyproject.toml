[project]
name = "magallanes-banking-core"
version = "0.1.0"
description = "Mock banking core API for a fictional retail bank, built to be called by conversational agents."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, F: basic errors. I: import order. B: likely bugs. UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
