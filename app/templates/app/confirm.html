{% extends "app/base.html" %}
{% block title %}{{ t.confirm_title }}{% endblock %}
{% block content %}
  <h1>{{ t.confirm_heading }}</h1>
  <p>{{ t.confirm_text }}</p>
  <p class="muted small">{{ t.confirm_code_hint }}</p>
  <div class="code" aria-label="{{ t.confirm_code_label }}">{{ confirmation.code }}</div>
  <form method="post">
    <button type="submit" name="decision" value="approve">{{ t.approve }}</button>
    <button type="submit" name="decision" value="deny" class="secondary">{{ t.deny }}</button>
  </form>
  <p class="muted small">{{ t.confirm_footnote }}</p>
{% endblock %}
