{# The brand in one place: the icons of the browser tab and the colour tokens.
   Every page includes this in its head, so a colour is changed here and nowhere else. #}
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B2530">
<style>
  :root {
    --bm-deep: #0B2530;   /* header bar, reversed ground, app icon */
    --bm-sea: #0F4C5C;    /* symbol + wordmark on white */
    --bm-mist: #9FC3C6;   /* BANCO on dark */
    --bm-copper: #C2622A; /* accent on white */
    --bm-glow: #F0A36B;   /* accent on dark */
    --bm-ice: #EEF4F3;    /* soft ground */
    --bm-display: "Fraunces", Georgia, serif;    /* 600 */
    --bm-text: "Manrope", system-ui, sans-serif; /* 600, BANCO caps +0.24em */
  }
</style>
