{% extends "app/base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block content %}
  <h1>{{ t.hello.format(name=customer.first_name) }}</h1>
  <p class="muted">{{ t.pin_prompt }}</p>
  <form method="post" action="/app/login">
    <input type="hidden" name="u" value="{{ customer.id }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input class="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}"
           maxlength="4" autocomplete="off" aria-label="PIN" required autofocus>
    {% if error %}<p class="error" role="alert">{{ t[error] }}</p>{% endif %}
    <button type="submit">{{ t.pin_enter }}</button>
  </form>
  <p class="muted small">{{ t.pin_warning }}</p>
{% endblock %}
